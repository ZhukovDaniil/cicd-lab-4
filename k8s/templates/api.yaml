apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pc-components.fullname" . }}-api
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
      {{- include "pc-components.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "pc-components.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - name: DATABASE_URL
              value: {{ printf "postgresql+psycopg://%s:%s@%s-postgres:%v/%s" .Values.database.user .Values.database.password (include "pc-components.fullname" .) .Values.database.port .Values.database.name | quote }}
            - name: CORS_ORIGINS
              value: "*"
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: pc-components-api
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: api
    {{- include "pc-components.selectorLabels" . | nindent 4 }}
