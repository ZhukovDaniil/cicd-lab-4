apiVersion: v1
kind: Service
metadata:
  name: {{ include "pc-components.fullname" . }}-postgres
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
  selector:
    app.kubernetes.io/component: database
    {{- include "pc-components.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pc-components.fullname" . }}-postgres
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "pc-components.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      {{- include "pc-components.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        {{- include "pc-components.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image | quote }}
          ports:
            - name: postgres
              containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ include "pc-components.fullname" . }}-db, key: database } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ include "pc-components.fullname" . }}-db, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "pc-components.fullname" . }}-db, key: password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.storageClassName }}
        storageClassName: {{ .Values.database.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage }}
