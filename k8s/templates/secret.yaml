apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pc-components.fullname" . }}-db
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.user | quote }}
  password: {{ .Values.database.password | quote }}
  database: {{ .Values.database.name | quote }}
