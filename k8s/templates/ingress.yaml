{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pc-components.fullname" . }}
  labels:
    {{- include "pc-components.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pc-components-api
                port: { number: {{ .Values.api.service.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pc-components.fullname" . }}-frontend
                port: { number: {{ .Values.frontend.service.port }} }
{{- end }}
