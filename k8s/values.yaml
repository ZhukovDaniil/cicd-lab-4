nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
api:
  replicaCount: 1
  image:
    repository: ghcr.io/zhukovdaniil/pc-components-api
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/zhukovdaniil/pc-components-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
migration:
  image:
    repository: ghcr.io/zhukovdaniil/pc-components-migrate
    tag: "latest"
    pullPolicy: IfNotPresent
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
database:
  image: postgres:16-alpine
  name: components
  user: components
  # For a lab only. For a real deployment use an externally managed Secret.
  password: change-me-lab-only
  port: 5432
  storage: 1Gi
  storageClassName: ""
ingress:
  enabled: true
  className: nginx
  host: webapp.lab.test
  annotations: {}
